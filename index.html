<!DOCTYPE html>
<!-- Define que o documento está usando HTML5 -->

<html lang="pt-br">
<!-- Define o idioma da página como português do Brasil -->

<head>
    <meta charset="UTF-8">
    <!-- Define a codificação de caracteres (UTF-8 permite acentos e caracteres especiais) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Faz o site ficar responsivo em dispositivos móveis -->

    <title>CineSearch</title>
    <!-- Título da página que aparece na aba do navegador -->

    <link rel="stylesheet" href="css/style.css">
    <!-- Importa o arquivo CSS para estilizar a página -->

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icons/icon-512x512.png">

</head>

<body>

<div class="container">
    <!-- Container principal que envolve todo o conteúdo -->

    <main class="content">
        <!-- Área principal do conteúdo da página -->

        <!-- TOPO DIREITO -->
        <div class="topo-direito">
            <!-- Div que agrupa o menu e a barra de pesquisa -->

            <div class="menu-topo">
                <a href="index.html">Home</a>
                <a href="./pages/sobre.html">Sobre</a>
                <a href="./pages/contato.html">Contato</a>
            </div>

            <div class="botaopesquisa">
                <!-- Área da barra de pesquisa -->

                <!-- ✅ ADICIONADO ID -->
                <input type="text" id="pesquisa" class="pesquisa" placeholder="Pesquisar...">

                <!-- ✅ ID CORRIGIDO -->
                <button class="btnBuscar" id="btnBuscar" type="button">Buscar</button>
            </div>
        </div>

        <!-- CONTEÚDO INICIAL -->
        <div id="resultado">
            <img src="cineSearch.png" alt="CineSearch" class="imagem">

            <h1 class="texto-boas-vindas">Bem-vindo ao CineSearch!</h1>

            <p>
                Encontre informações sobre seus filmes favoritos, descubra novos lançamentos 
                e explore o mundo do cinema com facilidade.
            </p>
        </div>

    </main>
</div>

<!-- ✅ DEFER adicionado -->
<script src="js/javascript.js" defer></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(() => console.log('Service Worker registrado'))
      .catch(err => console.log('Erro:', err));
  });
}
</script>

</body>
</html>
